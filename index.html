<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria com efeito fumê</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <div class="galeria">
      <!-- Os botões permitem selecionar as imagens pelo teclado. -->
      <button type="button" aria-label="Ampliar imagem de água-viva">
        <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBMUOSMBPHCp2jaxZ8jz6nF5-RwFZjkC0RyFXODKUynIxqnligtg8JbBd1yBizVZ38bXgS2kL_6ZQQP8rDRY6oZ0k8LFAGhT3uXfTomJjwIFlyS1AQ=w1366-h633?auditContext=forDisplay"Água-viva">
      </button>


      <button type="button" aria-label="Ampliar imagem de coala">
        <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBN49Ob7pOesaXYIqOn-zzwVO6JhymbjbVdRYxxrbFSrx5FCp5XvKxQgNrzt0ehBC7G1EZWduIubijb9CSNenLWHrPXGKLQxpbTLpdHzMHa-Ik7Cxg=w1366-h633?auditContext=forDisplay" alt="Coala">
      </button>


      <button type="button" aria-label="Ampliar paisagem de deserto">
        <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBO6ATAUcLJftKCmTwYIVpIAff8PO8pFaeeCwbRgvke2Ch_k3iT58HzQL0PHMc86VQ9sla-eiL-OwzANM6gVZ2svgLBZEkbvEEdUWyWhtvGpFSPi6w=w1366-h633?auditContext=forDisplay" alt="Paisagem de deserto">
      </button>


      <button type="button" aria-label="Ampliar flores em um lago">
        <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBPb6EGB48d-rJSNB0JO7GmHdGYKvsZ_1pJ3-S96c50oIRoggvsNTBeyItBz4kx_m63u1uPuv4PD-47inNzgfCVtIKRSzoXYV-9IDBJwoqryhhA0=w1366-h633?auditContext=forDisplay" alt="Flores em um lago">
      </button>


      <button type="button" aria-label="Ampliar casas próximas ao lago">
        <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBMcE21YpkHBLOrHHic3CXPAZzZ1bnGFq6N_nzZJbsslK8I-RD8ARWXSJ48QWff2uOK4k3LS52bFbZgKZvKK_tAcTuQxvV66h-HtUidxuxMx4B-tWg=w1366-h633?auditContext=forDisplay" alt="Casas próximas ao lago">
      </button>


      
      <button type="button" aria-label="Ampliar rio com árvores">
        <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBNZjJ0GlCF2eX1MbiND9XRCCJJsGh16N84RvmKFzO5IJR3xuroevwhasci2UPp6SXZvhLmdAJBDOTTyOn-XPDCWcf_64LN4BilYckjZ96dAKwm-=w1366-h633?auditContext=forDisplay"
      </button>

      <button type="button" aria-label="Ampliar arvore e céu">
        <img src="https://cursinhoparamedicina.com.br/wp-content/uploads/2022/10/Paisagem-1.jpg"
      </button>

       <button type="button" aria-label="Ampliar cachorrinho">
        <img src="https://papeismaster.com/wp-content/uploads/2018/11/f3c64d6b67efc2fc67afe3c2d923361e.jpg"
      </button>
      
    </div>
  </main>




  <!-- Janela que apresenta a imagem ampliada. -->
  <dialog class="ampliacao" aria-label="Imagem ampliada">
    <button class="fechar" type="button"
      aria-label="Fechar imagem ampliada">
      &times;
    </button>


    <img class="imagem-ampliada" alt="">
  </dialog>
 
  <script src="script.js"></script>
</body>
</html>
